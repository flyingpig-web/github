<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>체험 완료 — 한국의 호소</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link rel="stylesheet" type="text/css" media="screen" href="css/import.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.js"></script>
    <script src="js/preload-manifest.js"></script>
    <script src="js/common.js"></script>
    <script src="js/end-cert-base64.js"></script>
  </head>
  <body>
    <main>
      <div class="wrap">
        <div class="container">
          <!-- 완료 문구는 배경 이미지에 포함 -->
          <div class="cut-bg end-bg"></div>

          <!-- 이름 작성 -->
          <div class="end-input">
            <img class="box-img" src="img/7_END/end_text_box.png" alt="이름 작성" />
            <input id="nameInput" type="text" maxlength="10" placeholder="이름을 입력하세요" aria-label="이름 작성" />
          </div>

          <!-- 버튼: 증서 받기 / 처음으로 -->
          <div class="end-btns">
            <button id="btnGet"><img src="img/7_END/end_scrap.png" alt="증서 받기" /></button>
            <button id="btnHome"><img src="img/7_END/end_home.png" alt="처음으로" /></button>
          </div>

          <!-- 기록 증서(밀랍 원통 + 기록자 이름표) -->
          <div class="end-cert">
            <img class="cert-img" src="img/7_END/end_image.png" alt="한국의 호소 기록 증서" />
            <div class="cert-name" id="certName"></div>
          </div>
        </div>
      </div>
    </main>
    <script src="js/end.js"></script>
  </body>
</html>
